[package]
name = "mcp-auto-control"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.4.0", features = [
    "server",
    "macros",
    "transport-io",
    "schemars",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "std",
    "fmt",
] }
tokio = { version = "1", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "io-std",
    "signal",
    "time",
    "sync",
] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
schemars = "1.0"
rumqttc = "0.24"
clap = { version = "4", features = ["derive", "env"] }
